name: Docs

on:
  push:
    branches:
      - main
      - master
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate documentation structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required docs exist
        run: |
          # Use ls first for debugging if anything goes wrong
          ls -la
          ls -la docs/
          ls -la docs/rfcs/ || true

          # We use explicit checks so that bash's -e doesn't terminate prematurely and silently
          test -f README.md || (echo "README.md missing" && /bin/false)
          test -f docs/architecture-landscape.md || (echo "docs/architecture-landscape.md missing" && /bin/false)
          test -f docs/rfcs/RFC-0000-architectural-principles.md || (echo "docs/rfcs/RFC-0000-architectural-principles.md missing" && /bin/false)
          test -f docs/rfcs/RFC-0001-semantic-envelope.md || (echo "docs/rfcs/RFC-0001-semantic-envelope.md missing" && /bin/false)
          test -f docs/rfcs/RFC-0002-admission-boundary.md || (echo "docs/rfcs/RFC-0002-admission-boundary.md missing" && /bin/false)
          test -f docs/rfcs/RFC-0003-state-repository.md || (echo "docs/rfcs/RFC-0003-state-repository.md missing" && /bin/false)
          test -f docs/rfcs/RFC-0004-lifecycle-control.md || (echo "docs/rfcs/RFC-0004-lifecycle-control.md missing" && /bin/false)

      - name: List RFC files
        run: |
          echo "RFC files:"
          find docs/rfcs -maxdepth 1 -type f | sort
